# DF AI Orchestrator Configuration
# Feature: 002-foundation-infrastructure

# Network settings
listen_port: 5001
http_port: 8081
enable_http_api: true
read_timeout: 30s
write_timeout: 10s

# Protocol settings
heartbeat_interval: 10s
heartbeat_timeout: 15s
max_message_size: 104857600  # 100 MB (for large forts)

# Reconnection settings
reconnect_delay: 1s
reconnect_max_delay: 30s
reconnect_backoff_factor: 2.0

# Logging
log_level: info      # debug, info, warn, error
log_format: json     # json or text

# Topology overlay compression
topology_compression_mode: full  # full, active_z_levels, custom_bounds
topology_center_z: 0             # For active_z_levels mode
topology_z_radius: 3             # ±3 levels from center

# LLM Provider Configuration
llm_provider_type: claude        # claude, openai_compatible, multi_model

# Claude API settings
claude_api_key: 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
claude_model: claude-haiku-4-5-20251001  # Haiku (cheapest), or claude-sonnet-4-5, claude-opus-4-5

# OpenAI-compatible endpoint settings (when using openai_compatible or multi_model)
llm_endpoint: http://localhost:11434/v1  # Ollama default port, or 1234 for LM Studio
llm_model: qwen2.5:7b                    # For Ollama, or llama-3-70b for LM Studio
llm_api_key: ""                          # Empty for local servers

# Multi-model pipeline (when llm_provider_type: multi_model)
extractor_provider_type: openai_compatible
extractor_endpoint: http://localhost:11434/v1  # Ollama for fast feature extraction
extractor_model: qwen2.5:7b
extractor_temperature: 0.2              # Low for deterministic extraction

planner_provider_type: claude           # Claude for reasoning, or openai_compatible for local
planner_api_key: ${CLAUDE_API_KEY}
planner_model: claude-haiku-4-5-20251001  # Haiku for cheap planning
planner_temperature: 0.7                # Higher for creative planning

# LLM Request tuning
llm_temperature: 0.7            # Randomness (0.0-1.0)
llm_max_tokens: 2048            # Max response length (Haiku is concise, 2048 sufficient)
llm_timeout_seconds: 30s        # Request timeout (Haiku is fast, 30s plenty)

# Context assembly settings
context_budget_kb: 200          # Max context size for LLM (in KB)
context_update_frequency_seconds: 100  # How often to generate new context

# Viewport settings for context generation
viewport_active_z_margin: 3     # Z-levels above/below active level to include
viewport_hazard_margin_tiles: 5 # Tile margin around hazards to include
